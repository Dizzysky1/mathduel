name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm test
      - name: Verify vendored PeerJS integrity (INTEGRITY file and SRI attribute must both match)
        run: bash scripts/check-integrity.sh
      - name: Check for HTML/script injection sinks in app code
        run: bash scripts/check-sinks.sh
